name: CI

# Build/lint/typecheck/test gate — runs on every push to main and every pull
# request. Complementary to publish-images.yml (which only builds/pushes
# release Docker images on a version tag and never lints, type-checks, or
# tests): this is what actually catches a broken build (or a broken test)
# before it lands. The Go collectors still have no test suite, only
# `go build`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck and build all workspaces
        working-directory: backend
        run: npm run build

      - name: Test (auth, rbac, aggregator, bff)
        working-directory: backend
        run: npm test

  collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/collectors/**/go.sum

      - name: Build all collectors
        working-directory: backend/collectors
        run: go build all
