# Static scrape config — every backend service's /metrics endpoint, by its
# in-network Compose hostname/port. No service discovery needed: this
# stack's topology (docker-compose.yml) is fixed, not dynamically scaled.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: bff
    static_configs:
      - targets: ['bff:8080']
  - job_name: auth
    static_configs:
      - targets: ['auth:4000']
  - job_name: rbac
    static_configs:
      - targets: ['rbac:4001']
  - job_name: aggregator
    static_configs:
      - targets: ['aggregator:4002']
  - job_name: collector-aws
    static_configs:
      - targets: ['collector-aws:8080']
  - job_name: collector-gcp
    static_configs:
      - targets: ['collector-gcp:8080']
  - job_name: collector-alibaba
    static_configs:
      - targets: ['collector-alibaba:8080']
  - job_name: collector-oci
    static_configs:
      - targets: ['collector-oci:8080']
  - job_name: collector-biznet
    static_configs:
      - targets: ['collector-biznet:8080']
