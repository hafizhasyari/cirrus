name: cirrus

# Applied to every service below via `logging: *default-logging` — caps each
# container's own json-file log at 10MB x 3 files (~30MB) instead of the
# default unbounded growth. One shared anchor rather than duplicating this
# block 16 times: unlike the app-code duplication convention elsewhere in
# this repo (deliberate, to keep each service's own bootstrap independent),
# this is one YAML file with no per-service tuning called for, so a shared
# anchor only reduces the odds one service gets missed on a future edit.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      POSTGRES_DB: cirrus
      POSTGRES_USER: cirrus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cirrus"]
      interval: 5s
      retries: 10

  # Periodic gzipped pg_dump, over the network (never touches the pgdata
  # volume directly) — see backup/postgres-entrypoint.sh for the full
  # design/restore notes. Same image as `postgres` so pg_dump's version
  # always matches the server; bump both together if this ever changes.
  postgres-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PG_BACKUP_INTERVAL_SECONDS: ${PG_BACKUP_INTERVAL_SECONDS:-86400}
      PG_BACKUP_RETENTION_DAYS: ${PG_BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["sh", "/backup/entrypoint.sh"]
    volumes:
      - ./backup/postgres-entrypoint.sh:/backup/entrypoint.sh:ro
      - ./backups/postgres:/backups
      # postgres:17-alpine bakes in `VOLUME /var/lib/postgresql/data`; this
      # service only ever talks to postgres over the network (pg_dump -h
      # postgres) and never touches a local data dir, so mount tmpfs here
      # rather than let Compose silently create an unused anonymous volume.
      - type: tmpfs
        target: /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # One-shot fixup for the vault-init named volume: unlike vault-file (whose
  # path is baked into the hashicorp/vault image and already owned by
  # vault:vault, so Docker copies that ownership into a freshly created
  # volume), vault-init is a path the image has never heard of — a brand new
  # named volume mounted there comes up owned by root:root. vault's own
  # entrypoint.sh runs entirely as the image's non-root vault user (uid
  # 100/gid 1000; see entrypoint.sh's mlock comment for why), so it can't
  # mkdir/write into a root-owned mountpoint itself. The stock image's
  # docker-entrypoint.sh would normally chown paths like this, but only when
  # invoked as `vault ...` — our command is `sh /vault/entrypoint.sh`, so that
  # logic never fires. Chown it here instead, once, before vault starts.
  vault-init-permissions:
    image: hashicorp/vault:2.0.4
    user: root
    entrypoint: ["chown", "-R", "100:1000", "/vault/init"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    volumes:
      - vault-init:/vault/init
      # hashicorp/vault also bakes in `VOLUME /vault/file` + `VOLUME
      # /vault/logs`; this container's entrypoint never touches either path
      # (it only chowns /vault/init), so mount tmpfs for both rather than
      # let Compose silently create two unused anonymous volumes.
      - type: tmpfs
        target: /vault/file
      - type: tmpfs
        target: /vault/logs

  vault:
    image: hashicorp/vault:2.0.4
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      VAULT_API_ADDR: http://127.0.0.1:8200
      VAULT_ADDR: http://127.0.0.1:8200
      # Value RBAC will authenticate with (see rbac's own VAULT_TOKEN below) —
      # named differently in this container so the vault CLI never
      # auto-authenticates with it before entrypoint.sh has actually minted it.
      CIRRUS_RBAC_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required}
    command: ["sh", "/vault/entrypoint.sh"]
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/entrypoint.sh:/vault/entrypoint.sh:ro
      - ./vault/healthcheck.sh:/vault/healthcheck.sh:ro
      - vault-file:/vault/file
      # Separate from vault-file on purpose: holds the one-time bootstrap
      # record (unseal keys + root token) so it no longer lives in the same
      # volume as the encrypted secret data it can unlock — see entrypoint.sh.
      - vault-init:/vault/init
      # hashicorp/vault also bakes in `VOLUME /vault/logs`; this deployment
      # logs to stdout (captured by the json-file driver/logging caps above),
      # never to a file, so mount tmpfs here rather than let Compose silently
      # create an unused anonymous volume.
      - type: tmpfs
        target: /vault/logs
    depends_on:
      vault-init-permissions:
        condition: service_completed_successfully
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "sh", "/vault/healthcheck.sh"]
      interval: 5s
      retries: 10
      start_period: 15s

  # Periodic tar+gzip snapshot of vault-file (read-only mount) — see
  # backup/vault-entrypoint.sh for the full design/restore notes and why
  # vault-init (the unseal keys/root token) is deliberately NOT included.
  vault-backup:
    image: alpine:3.22
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      VAULT_BACKUP_INTERVAL_SECONDS: ${VAULT_BACKUP_INTERVAL_SECONDS:-86400}
      VAULT_BACKUP_RETENTION_DAYS: ${VAULT_BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["sh", "/backup/entrypoint.sh"]
    volumes:
      - ./backup/vault-entrypoint.sh:/backup/entrypoint.sh:ro
      - vault-file:/data:ro
      - ./backups/vault:/backups
    depends_on:
      vault:
        condition: service_healthy

  rbac:
    image: cirrus-rbac:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: rbac/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      PORT: 4001
      DATABASE_URL: postgres://cirrus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cirrus
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-21600}
      # Optional — outage alerting (lib/telegramAlert.ts) silently no-ops
      # unless both are set. See .env.example for how to get a bot token/chat id.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Optional — invite emails (lib/resendClient.ts) silently no-op unless
      # RESEND_API_KEY is set. See .env.example for the domain-verification
      # requirement on RESEND_FROM_EMAIL.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Cirrus <notification@example.com>}
      APP_URL: ${APP_URL:-http://localhost:5173}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.cirrus.internal}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required}
      AWS_COLLECTOR_URL: http://collector-aws:8080
      GCP_COLLECTOR_URL: http://collector-gcp:8080
      ALIBABA_COLLECTOR_URL: http://collector-alibaba:8080
      OCI_COLLECTOR_URL: http://collector-oci:8080
      BIZNET_COLLECTOR_URL: http://collector-biznet:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10
      start_period: 10s

  auth:
    image: cirrus-auth:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      PORT: 4000
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:8080/auth/callback}
      POST_LOGIN_REDIRECT: ${POST_LOGIN_REDIRECT:-http://localhost:5173/}
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.cirrus.internal}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cirrus-bff}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cirrus_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      AUTH_SIGNING_KEY_JWK: ${AUTH_SIGNING_KEY_JWK:-}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-20}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      rbac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10
      start_period: 10s

  collector-aws:
    image: cirrus-collector-aws:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend/collectors
      dockerfile: aws/Dockerfile
      args:
        CIRRUS_VERSION: ${CIRRUS_VERSION:-dev}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      PORT: 8080
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
    ports:
      - "5001:8080"
    depends_on:
      rbac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 10
      start_period: 5s

  collector-gcp:
    image: cirrus-collector-gcp:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend/collectors
      dockerfile: gcp/Dockerfile
      args:
        CIRRUS_VERSION: ${CIRRUS_VERSION:-dev}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      PORT: 8080
      AUTH_URL: http://auth:4000
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
    ports:
      - "5002:8080"
    depends_on:
      auth:
        condition: service_healthy
      rbac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 10
      start_period: 5s

  collector-alibaba:
    image: cirrus-collector-alibaba:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend/collectors
      dockerfile: alibaba/Dockerfile
      args:
        CIRRUS_VERSION: ${CIRRUS_VERSION:-dev}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      PORT: 8080
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
    ports:
      - "5003:8080"
    depends_on:
      rbac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 10
      start_period: 5s

  collector-oci:
    image: cirrus-collector-oci:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend/collectors
      dockerfile: oci/Dockerfile
      args:
        CIRRUS_VERSION: ${CIRRUS_VERSION:-dev}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # 1.0, not the other collectors' 0.5 — OCI's /test check does real
          # work (region-subscription discovery + a tenancy-root instance
          # list against Oracle's own API), and a concurrent manual test +
          # scheduled health-check pass once starved it of CPU past its
          # /test deadline. See CLAUDE.md.
          cpus: '1.0'
          memory: 256M
    environment:
      PORT: 8080
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
    ports:
      - "5004:8080"
    depends_on:
      rbac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 10
      start_period: 5s

  collector-biznet:
    image: cirrus-collector-biznet:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend/collectors
      dockerfile: biznet/Dockerfile
      args:
        CIRRUS_VERSION: ${CIRRUS_VERSION:-dev}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      PORT: 8080
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
    ports:
      - "5005:8080"
    depends_on:
      rbac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 10
      start_period: 5s

  aggregator:
    image: cirrus-aggregator:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: aggregator/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      PORT: 4002
      REDIS_URL: redis://redis:6379
      RBAC_URL: http://rbac:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
      AWS_COLLECTOR_URL: http://collector-aws:8080
      GCP_COLLECTOR_URL: http://collector-gcp:8080
      ALIBABA_COLLECTOR_URL: http://collector-alibaba:8080
      OCI_COLLECTOR_URL: http://collector-oci:8080
      BIZNET_COLLECTOR_URL: http://collector-biznet:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4002:4002"
    depends_on:
      redis:
        condition: service_healthy
      rbac:
        condition: service_healthy
      collector-aws:
        condition: service_healthy
      collector-gcp:
        condition: service_healthy
      collector-alibaba:
        condition: service_healthy
      collector-oci:
        condition: service_healthy
      collector-biznet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10
      start_period: 10s

  bff:
    image: cirrus-bff:${CIRRUS_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: bff/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      PORT: 8080
      AUTH_URL: http://auth:4000
      RBAC_URL: http://rbac:4001
      AGGREGATOR_URL: http://aggregator:4002
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cirrus_session}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.cirrus.internal}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cirrus-bff}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-300}
      RATE_LIMIT_API_WINDOW_SECONDS: ${RATE_LIMIT_API_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_healthy
      rbac:
        condition: service_healthy
      aggregator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10
      start_period: 10s

  # Scrapes /metrics off every backend service (see prometheus/prometheus.yml)
  # — PRD/TODO's "basic metrics/uptime visibility" P2 item. Internal-only:
  # its own port is published for local dev convenience (curl/browse the
  # expression UI directly) but cleared in docker-compose.prod.yml like
  # postgres/redis/vault, since this is an admin observability tool, not
  # something meant to be Traefik-routed or publicly reachable.
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  frontend:
    image: cirrus-frontend:${CIRRUS_VERSION:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    ports:
      - "5173:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - default
      - proxy
    healthcheck:
      # 127.0.0.1, not localhost: nginx binds 0.0.0.0:80 only (IPv4), but
      # localhost resolves to ::1 first inside this container, so wget kept
      # hitting "connection refused" on every probe despite the site working
      # fine — which also made Traefik (which excludes unhealthy containers
      # from routing) drop this as a backend entirely.
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1/"]
      interval: 5s
      retries: 10
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cirrus.rule=Host(`${TRAEFIK_HOSTNAME:-cirrus.localhost}`)"
      - "traefik.http.routers.cirrus.entrypoints=websecure"
      - "traefik.http.routers.cirrus.tls=true"
      - "traefik.http.routers.cirrus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cirrus.tls.domains[0].main=${TRAEFIK_CERT_DOMAIN:-localhost}"
      - "traefik.http.routers.cirrus.tls.domains[0].sans=*.${TRAEFIK_CERT_DOMAIN:-localhost}"
      - "traefik.http.services.cirrus.loadbalancer.server.port=80"

volumes:
  pgdata:
  vault-file:
  vault-init:
  prometheus-data:

networks:
  proxy:
    external: true
    name: proxy
