server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — set once here so every location below inherits them
    # (nginx only stops inheriting add_header from the server block for a
    # specific location once that location declares an add_header of its
    # own; none of the 4 below do today, so this block covers all of them).
    # style-src allows 'unsafe-inline' deliberately, not as an oversight —
    # the app renders 236+ dynamic/data-driven colors as inline style={{}}
    # (see CLAUDE.md), which a stricter style-src would break outright.
    # fonts.googleapis.com/fonts.gstatic.com are the only external origins
    # this app loads anything from (Google Fonts); every other asset is
    # bundled and served same-origin.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # GET /api/vms and POST /api/vms/refresh stream NDJSON chunks so the
    # Inventory screen can render each provider's VMs as they arrive instead
    # of waiting for all of them — nginx's default buffered proxying would
    # otherwise collect the whole chunked response before flushing it to the
    # browser, defeating that. This location's longer prefix wins over the
    # general /api/ block below without needing any explicit ordering/^~.
    location /api/vms {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
