server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GET /api/vms and POST /api/vms/refresh stream NDJSON chunks so the
    # Inventory screen can render each provider's VMs as they arrive instead
    # of waiting for all of them — nginx's default buffered proxying would
    # otherwise collect the whole chunked response before flushing it to the
    # browser, defeating that. This location's longer prefix wins over the
    # general /api/ block below without needing any explicit ordering/^~.
    location /api/vms {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
